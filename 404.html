<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Powerup AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;display=swap">
  <!-- Styles are inline because GitHub Pages serves this file at any missing path, where relative links to assets break. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #f7f5f0; color: #15181d; font: 17px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    .code { margin: 0; font-size: 0.875rem; font-weight: 600; color: #1f5a43; }
    h1 { margin: 10px 0 8px; font: 500 clamp(2.4rem, 6vw, 3.4rem)/1.1 "Newsreader", ui-serif, Georgia, serif; letter-spacing: -0.015em; }
    p { margin: 0; color: #3a3f47; }
    a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 28px; padding: 0 24px; border-radius: 999px; background: #1f5a43; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #174634; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That page doesn't exist or has moved.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
